name: Windows Release Build

# タグを打つと Windows インストーラーと、アップデーター用の署名付き成果物
# （*.nsis.zip / *.sig / latest.json）を GitHub Release へ公開する。
# latest.json は tauri.conf.json の plugins.updater.endpoints が参照する配信元。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust ツールチェーン セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: Lint と型チェック
        run: |
          npm run lint
          npm run type-check

      - name: バージョン整合の確認
        # package.json / tauri.conf.json / Cargo.toml / Cargo.lock がずれていると
        # 更新が配信されないため、ビルド前に止める
        run: npm run version:check

      - name: ビルドと Release への公開
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アップデーターの minisign 秘密鍵。失うと既存インストールへ更新を配信できなくなる
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 空パスワードの鍵は tauri-cli が扱えない（生成も署名も
          # "Wrong password for that key" で失敗する）ため、実パスワードを設定している。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            Windows 版インストーラーです。

            zip を解凍し、中のインストーラーを実行してください。
            未署名のため「WindowsによってPCが保護されました」と表示されますが、
            「詳細情報」→「実行」で進められます。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
